<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Conversational Analytics — Bubble + Pop-Out Window</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; overflow: hidden; height: 100vh; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(29,153,255,0.3); } 50% { box-shadow: 0 0 0 6px rgba(29,153,255,0); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

// ============================================================
// Data
// ============================================================

const SUGGESTED_QUESTIONS = {
  Overview: [
    "What are my top 5 returns drivers?",
    "Why did return rate increase 432% YoY?",
    "Compare return rates across all regions",
  ],
  "Returns Drivers": [
    "What's driving the Size & Fit spike?",
    "Show me customer experience insights for dresses",
    "Which department has the highest return rate?",
  ],
  Actions: [
    "How many open actions do I have?",
    "What's the ROI on completed actions this quarter?",
    "Show actions expiring this week",
  ],
};

const SAMPLE_RESPONSES = [
  {
    role: "assistant",
    text: "Based on the last 3 months, your worst performers in Women's Dresses:",
    items: [
      { name: "Floral Midi Dress", stats: "38.2% return rate | $420K lost rev" },
      { name: "Wrap Maxi Dress", stats: "34.7% return rate | $385K lost rev" },
      { name: "Bodycon Mini Dress", stats: "31.1% return rate | $298K lost rev" },
      { name: "A-Line Cocktail Dress", stats: "29.8% return rate | $275K lost rev" },
      { name: "Off-Shoulder Dress", stats: "27.4% return rate | $241K lost rev" },
    ],
    link: "View in Returns Drivers →",
  },
  {
    role: "assistant",
    text: "The Floral Midi Dress (Style #FMD-2847) has a 38.2% return rate over the last 90 days:",
    details: [
      { label: "Top Return Reason", value: "Size & Fit (62%)" },
      { label: "Second Reason", value: "Not as Expected (24%)" },
      { label: "Lost Revenue", value: "$420,000" },
      { label: "Units Returned", value: "3,847" },
      { label: "Avg Days to Return", value: "8.3 days" },
    ],
    text2: "Size guidance data shows this item runs small — 2.3:1 ratio of 'too small' vs 'too large'. 68% of exchanges go up one size.",
    link: "View Product Card →",
  },
  {
    role: "assistant",
    text: "2 active actions tied to this product's returns driver:",
    actions: [
      { title: "Update size chart — add 'runs small' guidance", status: "In Progress", owner: "Sarah M.", created: "Mar 15" },
      { title: "Add fit comparison photos to PDP", status: "Not Started", owner: "Unassigned", created: "Mar 22" },
    ],
    text2: "No completed actions yet — ROI measurement hasn't begun. The size chart update was started 17 days ago.",
    link: "View in Actions Module →",
  },
];

const RD_CATEGORIES = [
  { name: "Customer Experience", count: 571, value: "$37.6M" },
  { name: "Operations", count: 306, value: "$29.7M" },
  { name: "Assortment", count: 532, value: "$15.5M" },
  { name: "Size & Fit", count: 440, value: "$12.0M" },
  { name: "Best Performers", count: 327, value: "$10.5M" },
  { name: "Product Design", count: 214, value: "$8.4M" },
  { name: "Product Quality", count: 73, value: "$4.8M" },
];

const KPI_TILES = [
  { label: "Items Sold", value: "86.1M", change: "-8%", direction: "down" },
  { label: "Items Returned", value: "10.7M", change: "+85%", direction: "up" },
  { label: "Return Rate (V)", value: "12.4%", change: "+101%", direction: "up" },
  { label: "Return Rate ($)", value: "28.5%", change: "+432%", direction: "up" },
  { label: "Total Revenue", value: "$7.7B", change: "+3%", direction: "up" },
  { label: "Lost Revenue", value: "$2.2B", change: "+450%", direction: "up" },
];

// ============================================================
// Shared Components
// ============================================================

function ChatMessage({ msg }) {
  if (msg.role === "user") {
    return (
      <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 12, animation: "fadeIn 0.2s ease" }}>
        <div style={{ background: "#1e40af", color: "#fff", padding: "10px 14px", borderRadius: "16px 16px 4px 16px", maxWidth: "85%", fontSize: 13, lineHeight: 1.5 }}>
          {msg.text}
        </div>
      </div>
    );
  }
  return (
    <div style={{ display: "flex", justifyContent: "flex-start", marginBottom: 16, animation: "fadeIn 0.3s ease" }}>
      <div style={{ maxWidth: "92%" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }}>
          <div style={{ width: 22, height: 22, borderRadius: "50%", background: "linear-gradient(135deg, #12123E, #1D99FF)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 9, fontWeight: 700, color: "#fff" }}>C</div>
          <span style={{ fontSize: 10, color: "#94a3b8", fontWeight: 500 }}>Clarity</span>
        </div>
        <div style={{ fontSize: 13, color: "#334155", marginBottom: 8, lineHeight: 1.6 }}>{msg.text}</div>
        {msg.items && (
          <div style={{ marginBottom: 8, background: "#f8fafc", borderRadius: 8, padding: "8px 12px", border: "1px solid #f1f5f9" }}>
            {msg.items.map((item, i) => (
              <div key={i} style={{ padding: "6px 0", borderBottom: i < msg.items.length - 1 ? "1px solid #e2e8f0" : "none" }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: "#1e293b" }}>{i + 1}. {item.name}</div>
                <div style={{ fontSize: 11, color: "#64748b" }}>{item.stats}</div>
              </div>
            ))}
          </div>
        )}
        {msg.details && (
          <div style={{ marginBottom: 8, background: "#f8fafc", borderRadius: 8, padding: "10px 12px", border: "1px solid #f1f5f9" }}>
            {msg.details.map((d, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "4px 0", borderBottom: i < msg.details.length - 1 ? "1px solid #e2e8f0" : "none" }}>
                <span style={{ fontSize: 12, color: "#64748b" }}>{d.label}</span>
                <span style={{ fontSize: 12, fontWeight: 600, color: "#1e293b" }}>{d.value}</span>
              </div>
            ))}
          </div>
        )}
        {msg.actions && (
          <div style={{ marginBottom: 8 }}>
            {msg.actions.map((a, i) => (
              <div key={i} style={{ background: "#f8fafc", borderRadius: 8, padding: "10px 12px", border: "1px solid #f1f5f9", marginBottom: 6 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: "#1e293b", marginBottom: 4 }}>{a.title}</div>
                <div style={{ display: "flex", gap: 12, fontSize: 11, color: "#64748b" }}>
                  <span style={{ display: "inline-flex", alignItems: "center", gap: 4 }}>
                    <span style={{ width: 6, height: 6, borderRadius: "50%", background: a.status === "In Progress" ? "#f59e0b" : "#94a3b8" }}></span>
                    {a.status}
                  </span>
                  <span>{a.owner}</span>
                  <span>{a.created}</span>
                </div>
              </div>
            ))}
          </div>
        )}
        {msg.text2 && <div style={{ fontSize: 13, color: "#334155", marginBottom: 8, lineHeight: 1.6 }}>{msg.text2}</div>}
        {msg.link && (
          <a href="#" onClick={(e) => e.preventDefault()} style={{ fontSize: 12, color: "#1D99FF", textDecoration: "none", fontWeight: 500 }}>{msg.link}</a>
        )}
      </div>
    </div>
  );
}

function ChatInput({ placeholder, onSend, compact }) {
  const [value, setValue] = useState("");
  return (
    <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
      <input
        value={value}
        onChange={(e) => setValue(e.target.value)}
        onKeyDown={(e) => { if (e.key === "Enter" && value.trim()) { onSend(value); setValue(""); } }}
        placeholder={placeholder || "Ask Clarity anything..."}
        style={{
          flex: 1, padding: compact ? "8px 12px" : "10px 14px", border: "1px solid #e2e8f0", borderRadius: 20,
          fontSize: 13, outline: "none", background: "#fff",
        }}
      />
      <button
        onClick={() => { if (value.trim()) { onSend(value); setValue(""); } }}
        style={{
          width: compact ? 32 : 36, height: compact ? 32 : 36, borderRadius: "50%", border: "none",
          background: "#1D99FF", color: "#fff", cursor: "pointer", display: "flex",
          alignItems: "center", justifyContent: "center", fontSize: 16, flexShrink: 0,
        }}
      >&#8594;</button>
    </div>
  );
}

function PopOutIcon({ size = 14, color = "#fff" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
      <path d="M10 2h4v4" />
      <path d="M14 2L8 8" />
      <path d="M12 9v4a1 1 0 01-1 1H3a1 1 0 01-1-1V5a1 1 0 011-1h4" />
    </svg>
  );
}

// Left navigation
function LeftNav({ activePage, onPageChange, minimized, onToggle }) {
  const pages = ["Overview", "Returns Drivers", "Actions", "Products", "Data Explorer", "Reports"];
  const icons = { Overview: "\u{1F4CA}", "Returns Drivers": "\u{1F50D}", Actions: "\u26A1", Products: "\u{1F4E6}", "Data Explorer": "\u{1F4C8}", Reports: "\u{1F4C4}" };
  return (
    <div style={{
      width: minimized ? 56 : 200, background: "#fff", borderRight: "1px solid #e2e8f0",
      display: "flex", flexDirection: "column", height: "100%", transition: "width 0.2s", flexShrink: 0,
    }}>
      <div style={{ padding: minimized ? "16px 10px" : "16px 20px", borderBottom: "1px solid #f1f5f9" }}>
        <div style={{ width: 32, height: 32, borderRadius: 8, background: "#12123E", display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: 16, fontWeight: 800 }}>R</div>
      </div>
      <div style={{ flex: 1, padding: "8px 0", overflow: "auto" }}>
        {pages.map((pg) => (
          <button key={pg} onClick={() => onPageChange(pg)}
            style={{
              display: "flex", alignItems: "center", gap: 8, width: "100%",
              padding: minimized ? "10px" : "10px 20px", border: "none", cursor: "pointer",
              background: activePage === pg ? "#eff6ff" : "transparent",
              color: activePage === pg ? "#1D99FF" : "#475569",
              fontSize: 13, fontWeight: activePage === pg ? 600 : 400,
              textAlign: "left", transition: "all 0.15s",
              justifyContent: minimized ? "center" : "flex-start",
            }}>
            <span style={{ fontSize: 14 }}>{icons[pg]}</span>
            {!minimized && pg}
          </button>
        ))}
      </div>
      <div style={{ borderTop: "1px solid #f1f5f9", padding: "8px 0" }}>
        <button onClick={onToggle}
          style={{
            display: "flex", alignItems: "center", gap: 8, width: "100%",
            padding: minimized ? "10px" : "10px 20px", border: "none", cursor: "pointer",
            background: "transparent", color: "#94a3b8", fontSize: 12,
            textAlign: "left", justifyContent: minimized ? "center" : "flex-start",
          }}>
          <span>{minimized ? "\u2192" : "\u2190"}</span>
          {!minimized && "Minimize"}
        </button>
      </div>
    </div>
  );
}

// Dashboard content
function DashboardContent() {
  return (
    <div style={{ padding: 24, overflow: "auto", flex: 1 }}>
      <div style={{ display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap", alignItems: "center" }}>
        {["All Brands", "All Regions", "All Channels", "All Departments", "Rolling 3 Months"].map((f) => (
          <select key={f} style={{ padding: "6px 12px", border: "1px solid #e2e8f0", borderRadius: 6, fontSize: 12, color: "#475569", background: "#fff", cursor: "pointer" }}>
            <option>{f}</option>
          </select>
        ))}
        <button style={{ padding: "6px 16px", background: "#12123E", color: "#fff", border: "none", borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Apply Filters</button>
        <button style={{ padding: "6px 16px", background: "#fff", color: "#475569", border: "1px solid #e2e8f0", borderRadius: 6, fontSize: 12, cursor: "pointer" }}>Reset</button>
      </div>
      <div style={{ marginBottom: 20 }}>
        <div style={{ display: "flex", alignItems: "baseline", gap: 12, marginBottom: 12 }}>
          <span style={{ fontSize: 15, fontWeight: 700, color: "#0f172a" }}>Returns Drivers</span>
          <span style={{ fontSize: 12, color: "#64748b" }}>Total Revenue Opportunity: <strong style={{ color: "#0f172a" }}>$55.8M</strong></span>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 8, marginBottom: 8 }}>
          {RD_CATEGORIES.slice(0, 5).map((cat) => (
            <div key={cat.name} style={{ background: "#fff", border: "1px solid #e2e8f0", borderRadius: 8, padding: "12px 14px", cursor: "pointer", transition: "border-color 0.15s" }}
              onMouseEnter={(e) => e.currentTarget.style.borderColor = "#1D99FF"}
              onMouseLeave={(e) => e.currentTarget.style.borderColor = "#e2e8f0"}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "start", marginBottom: 4 }}>
                <span style={{ fontSize: 12, fontWeight: 600, color: "#334155" }}>{cat.name}</span>
                <span style={{ fontSize: 10, background: "#e2e8f0", color: "#475569", padding: "1px 6px", borderRadius: 4, fontWeight: 600 }}>{cat.count}</span>
              </div>
              <div style={{ fontSize: 14, fontWeight: 700, color: "#1D99FF" }}>{cat.value}</div>
            </div>
          ))}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
          {RD_CATEGORIES.slice(5).map((cat) => (
            <div key={cat.name} style={{ background: "#fff", border: "1px solid #e2e8f0", borderRadius: 8, padding: "12px 14px", cursor: "pointer" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "start", marginBottom: 4 }}>
                <span style={{ fontSize: 12, fontWeight: 600, color: "#334155" }}>{cat.name}</span>
                <span style={{ fontSize: 10, background: "#e2e8f0", color: "#475569", padding: "1px 6px", borderRadius: 4, fontWeight: 600 }}>{cat.count}</span>
              </div>
              <div style={{ fontSize: 14, fontWeight: 700, color: "#1D99FF" }}>{cat.value}</div>
            </div>
          ))}
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 8, marginBottom: 20 }}>
        {KPI_TILES.map((kpi) => (
          <div key={kpi.label} style={{ background: "#fff", border: "1px solid #e2e8f0", borderRadius: 8, padding: "14px" }}>
            <div style={{ fontSize: 11, color: "#64748b", marginBottom: 4 }}>{kpi.label}</div>
            <div style={{ fontSize: 20, fontWeight: 700, color: "#0f172a" }}>{kpi.value}</div>
            <div style={{ fontSize: 11, color: kpi.direction === "down" ? "#16a34a" : "#dc2626", marginTop: 2 }}>{kpi.change} from last year</div>
          </div>
        ))}
      </div>
      <div style={{ background: "#f5f3ff", border: "1px solid #e9e5ff", borderRadius: 8, padding: 16 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
          <span style={{ fontSize: 14 }}>&#10024;</span>
          <span style={{ fontSize: 13, fontWeight: 700, color: "#5b21b6" }}>AI Returns Summary</span>
        </div>
        <div style={{ fontSize: 12, color: "#475569", lineHeight: 1.6 }}>
          The return rate increased 432% year-over-year, reaching 28.5% and contributing to a 450% increase in lost revenue to $2.2 billion, despite a 3% rise in total revenue. This significant increase was primarily driven by a rise in the US region, from 4.9% to 29.2%.
        </div>
      </div>
    </div>
  );
}

// ============================================================
// POP-OUT WINDOW HTML GENERATOR
// ============================================================

function generatePopoutHTML(messages, page, contextEnabled) {
  const messagesJSON = JSON.stringify(messages);
  return `<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>Returnalyze Clarity</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .msg-enter { animation: fadeIn 0.25s ease; }
  input:focus { outline: none; border-color: #1D99FF !important; }
  button { font-family: inherit; }
</style>
</head><body>
<div id="popout-root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"><\/script>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const RESPONSES = ${JSON.stringify(SAMPLE_RESPONSES)};
const SUGGESTED = ${JSON.stringify(SUGGESTED_QUESTIONS)};
const initMessages = ${messagesJSON};
const initPage = "${page}";
const initContext = ${contextEnabled};

function ChatMessage({ msg }) {
  if (msg.role === "user") {
    return React.createElement("div", { className: "msg-enter", style: { display: "flex", justifyContent: "flex-end", marginBottom: 12 } },
      React.createElement("div", { style: { background: "#1e40af", color: "#fff", padding: "10px 14px", borderRadius: "16px 16px 4px 16px", maxWidth: "82%", fontSize: 13, lineHeight: 1.5 } }, msg.text)
    );
  }
  const children = [];
  children.push(React.createElement("div", { key: "av", style: { display: "flex", alignItems: "center", gap: 6, marginBottom: 6 } },
    React.createElement("div", { style: { width: 22, height: 22, borderRadius: "50%", background: "linear-gradient(135deg, #12123E, #1D99FF)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 9, fontWeight: 700, color: "#fff" } }, "C"),
    React.createElement("span", { style: { fontSize: 10, color: "#94a3b8", fontWeight: 500 } }, "Clarity")
  ));
  if (msg.text) children.push(React.createElement("div", { key: "txt", style: { fontSize: 13, color: "#334155", marginBottom: 8, lineHeight: 1.6 } }, msg.text));
  if (msg.items) {
    children.push(React.createElement("div", { key: "items", style: { marginBottom: 8, background: "#f8fafc", borderRadius: 8, padding: "8px 12px", border: "1px solid #f1f5f9" } },
      msg.items.map(function(item, i) {
        return React.createElement("div", { key: i, style: { padding: "6px 0", borderBottom: i < msg.items.length - 1 ? "1px solid #e2e8f0" : "none" } },
          React.createElement("div", { style: { fontSize: 13, fontWeight: 600, color: "#1e293b" } }, (i+1) + ". " + item.name),
          React.createElement("div", { style: { fontSize: 11, color: "#64748b" } }, item.stats)
        );
      })
    ));
  }
  if (msg.details) {
    children.push(React.createElement("div", { key: "det", style: { marginBottom: 8, background: "#f8fafc", borderRadius: 8, padding: "10px 12px", border: "1px solid #f1f5f9" } },
      msg.details.map(function(d, i) {
        return React.createElement("div", { key: i, style: { display: "flex", justifyContent: "space-between", padding: "4px 0", borderBottom: i < msg.details.length - 1 ? "1px solid #e2e8f0" : "none" } },
          React.createElement("span", { style: { fontSize: 12, color: "#64748b" } }, d.label),
          React.createElement("span", { style: { fontSize: 12, fontWeight: 600, color: "#1e293b" } }, d.value)
        );
      })
    ));
  }
  if (msg.actions) {
    children.push(React.createElement("div", { key: "acts", style: { marginBottom: 8 } },
      msg.actions.map(function(a, i) {
        return React.createElement("div", { key: i, style: { background: "#f8fafc", borderRadius: 8, padding: "10px 12px", border: "1px solid #f1f5f9", marginBottom: 6 } },
          React.createElement("div", { style: { fontSize: 12, fontWeight: 600, color: "#1e293b", marginBottom: 4 } }, a.title),
          React.createElement("div", { style: { display: "flex", gap: 12, fontSize: 11, color: "#64748b" } },
            React.createElement("span", { style: { display: "inline-flex", alignItems: "center", gap: 4 } },
              React.createElement("span", { style: { width: 6, height: 6, borderRadius: "50%", display: "inline-block", background: a.status === "In Progress" ? "#f59e0b" : "#94a3b8" } }),
              " " + a.status
            ),
            React.createElement("span", null, a.owner),
            React.createElement("span", null, a.created)
          )
        );
      })
    ));
  }
  if (msg.text2) children.push(React.createElement("div", { key: "txt2", style: { fontSize: 13, color: "#334155", marginBottom: 8, lineHeight: 1.6 } }, msg.text2));
  if (msg.link) children.push(React.createElement("a", { key: "lnk", href: "#", onClick: function(e) { e.preventDefault(); }, style: { fontSize: 12, color: "#1D99FF", textDecoration: "none", fontWeight: 500 } }, msg.link));
  return React.createElement("div", { className: "msg-enter", style: { display: "flex", justifyContent: "flex-start", marginBottom: 16 } },
    React.createElement("div", { style: { maxWidth: "92%" } }, children)
  );
}

function PopoutApp() {
  const [messages, setMessages] = useState(initMessages);
  const [currentPage, setCurrentPage] = useState(initPage);
  const [ctxOn, setCtxOn] = useState(initContext);
  const [responseIdx, setResponseIdx] = useState(Math.min(initMessages.filter(function(m) { return m.role === "user"; }).length, RESPONSES.length));
  const chatEnd = useRef(null);
  const [activeTab, setActiveTab] = useState("current");

  useEffect(function() { chatEnd.current && chatEnd.current.scrollIntoView({ behavior: "smooth" }); }, [messages]);

  // Listen for page changes from parent
  useEffect(function() {
    function handler(e) {
      if (e.data && e.data.type === "PAGE_CHANGE") {
        setCurrentPage(e.data.page);
      }
      if (e.data && e.data.type === "POPIN_REQUEST") {
        // Send state back and close

                      }}
                      onMouseEnter={(e) => { e.currentTarget.style.borderColor = "#1D99FF"; e.currentTarget.style.color = "#1D99FF"; }}
                      onMouseLeave={(e) => { e.currentTarget.style.borderColor = "#f1f5f9"; e.currentTarget.style.color = "#475569"; }}>
                      {q}
                    </button>
                  ))}
                </div>
              )}
              {messages.map((msg, i) => <ChatMessage key={i} msg={msg} />)}
              <div ref={chatEndRef} />
            </div>

            {/* Input */}
            <div style={{ padding: "10px 14px", borderTop: "1px solid #f1f5f9", background: "#fff", flexShrink: 0 }}>
              <ChatInput placeholder="Ask Clarity anything..." onSend={sendMessage} compact />
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
